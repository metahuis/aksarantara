<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aksarantara — Tidak Ada Koneksi</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Nunito', system-ui, sans-serif;
      background: #0f2615;
      color: #fff;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      gap: 24px;
    }
    svg { opacity: 0.9; }
    h1 { font-size: 1.5rem; font-weight: 700; line-height: 1.3; }
    p { font-size: 1rem; opacity: 0.7; max-width: 300px; line-height: 1.6; }
    button {
      background: #58cc02;
      color: #fff;
      border: none;
      border-radius: 14px;
      padding: 14px 32px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <svg width="64" height="64" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
    <rect width="512" height="512" rx="112" fill="#58cc02"/>
    <g transform="translate(77,77) scale(16.27)">
      <polygon points="11,2 21,20 1,20" fill="#0f2615"/>
      <rect x="8.5" y="12" width="5" height="5" fill="#58cc02"/>
    </g>
  </svg>
  <h1>Aksarantara</h1>
  <p>Tidak ada koneksi internet. Beberapa halaman yang sudah dikunjungi mungkin masih tersedia.</p>
  <button onclick="window.history.back()">Kembali</button>
</body>
</html>
